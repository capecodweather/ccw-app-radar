name: Build App Radar

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Check out published gh-pages branch
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: published

      - name: Seed output with current published state
        run: |
          mkdir -p repo/output
          if [ -f published/manifest.json ]; then
            cp -R published/. repo/output/
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gfortran \
            libproj-dev \
            proj-data \
            proj-bin \
            libgeos-dev \
            libopenjp2-7-dev \
            libatlas-base-dev \
            libbz2-dev \
            liblzma-dev \
            libcurl4-openssl-dev

      - name: Install Python dependencies
        working-directory: repo
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build incremental radar frames
        working-directory: repo
        env:
          RADAR_SITE: KBOX
          RADAR_FRAME_COUNT: "12"
          RADAR_OBJECT_SCAN_LIMIT: "24"
          APP_RADAR_OUTPUT_DIR: output
          APP_RADAR_FIGURE_SIZE: "6"
          APP_RADAR_DPI: "160"
        run: python build_app_radar_incremental.py

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo/output
          publish_branch: gh-pages
